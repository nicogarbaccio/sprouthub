<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OneSignal Test</title>
  <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
</head>
<body>
  <h1>OneSignal Web Push Test</h1>
  <div id="status">Initializing...</div>
  <div id="results"></div>
  <button id="requestPermission" style="margin-top: 20px; padding: 10px;">Request Permission</button>
  <button id="checkStatus" style="margin-top: 20px; padding: 10px;">Check Status</button>

  <script>
    const APP_ID = '5db8206d-53e2-4cfc-a001-a97f630bafc1';
    const statusDiv = document.getElementById('status');
    const resultsDiv = document.getElementById('results');
    const requestBtn = document.getElementById('requestPermission');
    const checkBtn = document.getElementById('checkStatus');

    function log(message, isError = false) {
      console.log(message);
      const p = document.createElement('p');
      p.textContent = message;
      p.style.color = isError ? 'red' : 'green';
      resultsDiv.appendChild(p);
    }

    // Initialize OneSignal
    window.OneSignal = window.OneSignal || [];

    window.OneSignal.push(async function() {
      try {
        log('Starting OneSignal initialization...');

        await window.OneSignal.init({
          appId: APP_ID,
          allowLocalhostAsSecureOrigin: true,
          serviceWorkerParam: { scope: '/' },
          serviceWorkerPath: '/OneSignalSDKWorker.js',
          notifyButton: { enable: false }
        });

        log('✅ OneSignal initialized successfully!');
        statusDiv.textContent = 'OneSignal initialized!';

        // Check permission status
        const permission = await window.OneSignal.Notifications.permission;
        log(`Permission status: ${permission}`);

        // Get player ID if subscribed
        try {
          const playerId = await window.OneSignal.User.PushSubscription.id;
          if (playerId) {
            log(`✅ Player ID: ${playerId}`);
          } else {
            log('No Player ID yet (not subscribed)');
          }
        } catch (err) {
          log('No Player ID yet (not subscribed)');
        }

      } catch (error) {
        log(`❌ Error initializing OneSignal: ${error.message}`, true);
        statusDiv.textContent = 'Error initializing OneSignal!';
        console.error(error);
      }
    });

    requestBtn.addEventListener('click', async () => {
      try {
        log('Requesting permission...');
        const result = await window.OneSignal.Notifications.requestPermission();

        if (result) {
          log('✅ Permission granted!');

          // Wait a moment for OneSignal to register
          setTimeout(async () => {
            try {
              const playerId = await window.OneSignal.User.PushSubscription.id;
              if (playerId) {
                log(`✅ Player ID: ${playerId}`);
                log('You should now see yourself in OneSignal dashboard!');
              }
            } catch (err) {
              log('Waiting for Player ID...', true);
            }
          }, 2000);
        } else {
          log('❌ Permission denied', true);
        }
      } catch (error) {
        log(`❌ Error requesting permission: ${error.message}`, true);
      }
    });

    checkBtn.addEventListener('click', async () => {
      try {
        const permission = await window.OneSignal.Notifications.permission;
        log(`Current permission: ${permission}`);

        const playerId = await window.OneSignal.User.PushSubscription.id;
        if (playerId) {
          log(`✅ Player ID: ${playerId}`);
        } else {
          log('No Player ID (not subscribed yet)');
        }

        const isPushEnabled = await window.OneSignal.User.PushSubscription.optedIn;
        log(`Push enabled: ${isPushEnabled}`);

      } catch (error) {
        log(`❌ Error checking status: ${error.message}`, true);
      }
    });
  </script>
</body>
</html>
