<!DOCTYPE html>
<html>
  <head>
    <title>Error Handling Test</title>
    <style>
      .record {
        margin: 10px 0;
        padding: 10px;
        border: 1px solid #ddd;
      }
      .loading {
        opacity: 0.5;
      }
      .error {
        color: red;
        background: #fee;
        padding: 10px;
      }
      button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
    </style>
  </head>
  <body>
    <div id="records">
      <div class="record" data-testid="watering-record-watering-1">
        <p>Record 1 - Will fail</p>
        <button
          data-testid="delete-watering-watering-1"
          onclick="deleteRecord('watering-1')"
        >
          Delete
        </button>
      </div>
    </div>
    <div id="messages"></div>

    <script>
      let isDeleting = false;
      let deleteAttempts = 0;

      async function deleteRecord(recordId) {
        if (isDeleting) {
          console.log("Delete already in progress, ignoring click");
          return;
        }

        // Mark as deleting and increment attempts only once
        isDeleting = true;

        // Only count the first attempt
        if (deleteAttempts === 0) {
          deleteAttempts = 1;
        }

        const button = document.querySelector(
          `[data-testid="delete-watering-${recordId}"]`
        );
        const record = document.querySelector(
          `[data-testid="watering-record-${recordId}"]`
        );

        // Show loading state
        button.setAttribute("disabled", "");
        button.textContent = "Deleting...";
        record.classList.add("loading");

        try {
          // Simulate API call that always fails
          await new Promise((_, reject) =>
            setTimeout(() => reject(new Error("Simulated failure")), 100)
          );
        } catch (error) {
          // Clear any existing error messages before showing new one
          const messagesDiv = document.getElementById("messages");
          messagesDiv.innerHTML = "";

          showError("Failed to delete record. Please try again.");
          button.removeAttribute("disabled");
          button.textContent = "Delete";
          record.classList.remove("loading");
        } finally {
          isDeleting = false;
          window.deleteAttempts = deleteAttempts;
        }
      }

      function showError(message) {
        const messagesDiv = document.getElementById("messages");
        const errorDiv = document.createElement("div");
        errorDiv.className = "error";
        errorDiv.textContent = message;
        errorDiv.setAttribute("data-testid", "error-message");
        messagesDiv.appendChild(errorDiv);
      }

      // Initialize tracking variables
      window.deleteAttempts = 0;
    </script>
  </body>
</html>
