<!DOCTYPE html>
<html>
  <head>
    <title>Basic Watering Record Test</title>
    <style>
      .record {
        margin: 10px 0;
        padding: 10px;
        border: 1px solid #ddd;
      }
      .loading {
        opacity: 0.5;
      }
      .success {
        color: green;
        background: #efe;
        padding: 10px;
      }
      button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
    </style>
  </head>
  <body>
    <div id="records">
      <div class="record" data-testid="watering-record-watering-1">
        <p>January 18, 2025 - Regular watering</p>
        <button
          data-testid="delete-watering-watering-1"
          onclick="deleteRecord('watering-1')"
        >
          Delete
        </button>
      </div>
    </div>
    <div id="messages"></div>

    <script>
      async function deleteRecord(recordId) {
        const button = document.querySelector(
          '[data-testid="delete-watering-' + recordId + '"]'
        );
        const recordElement = document.querySelector(
          '[data-testid="watering-record-' + recordId + '"]'
        );

        // Show loading state
        button.disabled = true;
        button.textContent = "Deleting...";
        recordElement.classList.add("loading");

        // Simulate delete operation
        await new Promise((resolve) => setTimeout(resolve, 100));

        // Update UI
        recordElement.style.display = "none";
        showSuccess("Record deleted successfully");
      }

      function showSuccess(message) {
        const messagesDiv = document.getElementById("messages");
        const successDiv = document.createElement("div");
        successDiv.className = "success";
        successDiv.textContent = message;
        successDiv.setAttribute("data-testid", "success-message");
        messagesDiv.appendChild(successDiv);
      }
    </script>
  </body>
</html>
