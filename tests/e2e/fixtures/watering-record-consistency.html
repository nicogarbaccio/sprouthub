<!DOCTYPE html>
<html>
  <head>
    <title>Data Consistency Test</title>
    <style>
      .record {
        margin: 10px 0;
        padding: 10px;
        border: 1px solid #ddd;
      }
      .loading {
        opacity: 0.5;
      }
      .success {
        color: green;
        background: #efe;
        padding: 10px;
      }
      .error {
        color: red;
        background: #fee;
        padding: 10px;
      }
      .deleted {
        display: none;
      }
      button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
    </style>
  </head>
  <body>
    <div id="records">
      <div class="record" data-testid="watering-record-1">
        <p>Record 1 - Will succeed</p>
        <button data-testid="delete-record-1" onclick="deleteRecord('1', true)">
          Delete
        </button>
      </div>
      <div class="record" data-testid="watering-record-2">
        <p>Record 2 - Will fail</p>
        <button
          data-testid="delete-record-2"
          onclick="deleteRecord('2', false)"
        >
          Delete
        </button>
      </div>
    </div>
    <div id="messages"></div>

    <script>
      const activeOperations = new Set();
      window.operationLog = [];
      window.recordStates = new Map();

      async function deleteRecord(recordId, shouldSucceed) {
        if (activeOperations.has(recordId)) return;

        activeOperations.add(recordId);
        window.operationLog.push(`start-${recordId}`);
        window.recordStates.set(recordId, "deleting");

        const button = document.querySelector(
          `[data-testid="delete-record-${recordId}"]`
        );
        const record = document.querySelector(
          `[data-testid="watering-record-${recordId}"]`
        );

        button.setAttribute("disabled", "");
        button.textContent = "Deleting...";
        record.classList.add("loading");

        try {
          await new Promise((resolve, reject) => {
            setTimeout(() => {
              if (shouldSucceed) {
                resolve();
              } else {
                reject(new Error("Simulated failure"));
              }
            }, 200);
          });

          record.classList.add("deleted");
          showSuccess(`Record ${recordId} deleted successfully`);
          window.operationLog.push(`complete-${recordId}`);
          window.recordStates.set(recordId, "deleted");
        } catch (error) {
          showError(`Failed to delete record ${recordId}`);
          button.removeAttribute("disabled");
          button.textContent = "Delete";
          record.classList.remove("loading");
          window.operationLog.push(`error-${recordId}`);
          window.recordStates.set(recordId, "error");
        } finally {
          activeOperations.delete(recordId);
        }
      }

      function showSuccess(message) {
        const messagesDiv = document.getElementById("messages");
        const div = document.createElement("div");
        div.className = "success";
        div.textContent = message;
        div.setAttribute("data-testid", `success-message-${Date.now()}`);
        messagesDiv.appendChild(div);
      }

      function showError(message) {
        const messagesDiv = document.getElementById("messages");
        const div = document.createElement("div");
        div.className = "error";
        div.textContent = message;
        div.setAttribute("data-testid", `error-message-${Date.now()}`);
        messagesDiv.appendChild(div);
      }
    </script>
  </body>
</html>
