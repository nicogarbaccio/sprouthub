<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>sprouthub</title>
    <meta
      name="description"
      content="Track and maintain your indoor plants with sprouthub - watering reminders, care guides, and plant collections"
    />
    <meta name="author" content="sprouthub" />

    <meta
      property="og:title"
      content="sprouthub - your personal plant care assistant"
    />
    <meta
      property="og:description"
      content="Track and maintain your indoor plants with sprouthub - watering reminders, care guides, and plant collections"
    />
    <meta property="og:type" content="website" />
    <meta
      property="og:image"
      content="https://res.cloudinary.com/dojdglovh/image/upload/v1749047653/ChatGPT_Image_Jun_4_2025_10_31_01_AM_b4iog6.png"
    />

    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:image"
      content="https://res.cloudinary.com/dojdglovh/image/upload/v1749047653/ChatGPT_Image_Jun_4_2025_10_31_01_AM_b4iog6.png"
    />

    <!-- Favicon: the white logo. Browsers with SVG favicon support use the SVG; the rest
         (Safari, some mobile browsers) use favicon.ico, the white logo on forest green so it
         shows on light tab bars too. Bump ?v= when an icon changes: browsers cache favicons
         for a long time. Regenerate the PNGs and .ico with `npm run generate:icons`. -->
    <link rel="icon" href="/favicon.ico?v=2" sizes="48x48" />
    <link rel="icon" href="/sprouthub-logo-white.svg?v=2" type="image/svg+xml" />
    <!-- iOS home screen and tab icon -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;600;700;800&family=Hanken+Grotesk:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- OneSignal SDK - loaded but NOT auto-initialized -->
    <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>

    <!-- Theme script to prevent flash of light mode -->
    <script>
      (function () {
        const storageKey = "sprouthub-ui-theme";
        const theme = localStorage.getItem(storageKey) || "system";

        if (
          theme === "dark" ||
          (theme === "system" &&
            window.matchMedia("(prefers-color-scheme: dark)").matches)
        ) {
          document.documentElement.classList.add("dark");
        } else {
          document.documentElement.classList.remove("dark");
        }
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
